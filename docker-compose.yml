services:
  db:
    image: postgis/postgis:16-3.4
    container_name: vw_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: DupaBlada2137?
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./db/wolumenPG:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
